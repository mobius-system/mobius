<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobius · 极简工作台</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css?v=2"><link rel="stylesheet" href="./mobius.css?v=2"><link rel="stylesheet" href="./sketch.css?v=1"></head>
<body><div id="app" class="app">
<aside class="sidebar" aria-label="主导航">
<div class="window-tools"><div class="traffic"><i></i><i></i><i></i></div><button data-action="left" aria-label="折叠左栏" data-icon="panel"></button><button data-action="back" aria-label="返回" data-icon="arrow-left"></button><button data-action="forward" aria-label="前进" data-icon="arrow-right"></button></div>
<div class="brand-row"><button class="brand" data-action="settings"><span data-copy="brand">Mobius</span><span data-icon="chevron"></span></button><button data-action="search" aria-label="搜索对话" data-icon="search"></button><button data-action="notifications" aria-label="通知" data-icon="bell"></button></div>
<nav><button data-action="new"><span data-icon="edit"></span><span data-copy="new">新对话</span><span class="nav-end" data-icon="circle-plus"></span></button><button data-action="pull"><span data-icon="branch"></span><span data-copy="pull">拉取请求</span></button><button data-action="sites"><span data-icon="grid"></span><span data-copy="sites">站点</span></button><button data-action="scheduled"><span data-icon="clock"></span><span data-copy="scheduled">已安排</span></button><button data-action="plugins"><span data-icon="plugin"></span><span data-copy="plugins">插件</span></button></nav>
<section class="project-section"><div class="section-label" data-copy="projects">项目</div><button class="empty-project" data-action="project" data-copy="emptyProject">没有项目</button><div id="project-list"></div></section>
<section class="recent-section"><div class="section-label" data-copy="recent">最近</div><div id="recent-list"></div></section>
<footer><button class="profile" data-action="profile"><span class="avatar">M</span><span data-copy="user">我</span></button><button data-action="voice" class="voice"><span data-icon="wave"></span><span data-copy="voice">语音</span></button><button data-action="settings" aria-label="调整界面" data-icon="help"></button></footer>
<div class="resize resize-left" role="separator" tabindex="0" aria-label="调整左栏宽度" aria-orientation="vertical"></div>
</aside>
<main class="main"><div class="mobile-tools"><button data-action="left" aria-label="展开左栏" data-icon="panel"></button></div>
<section class="welcome"><svg class="mascot" viewBox="0 0 60 60" fill="none" aria-hidden="true"><path d="M17 17c0-11 16-13 21-5 11-3 19 7 15 16 8 9 1 22-9 22-5 10-19 9-23 0C9 51 4 38 10 30c-5-6-1-13 7-13Z" stroke="currentColor" stroke-width="3.3" stroke-linejoin="round"/><path d="m21 24 5 8-5 8m14 0h9" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 data-copy="heading">我们要构建什么？</h1><div class="cards" id="cards"></div></section>
<section class="conversation" id="conversation" aria-live="polite" hidden></section>
<div class="composer-wrap"><button class="project-picker" data-action="project"><span data-icon="folder"></span><span id="selected-project">选择项目</span></button><form class="composer" id="composer"><div id="attachments"></div><textarea id="prompt" aria-label="消息" placeholder="随心输入" rows="2"></textarea><div class="composer-bottom"><button type="button" data-action="attach" aria-label="添加附件" data-icon="plus"></button><button type="button" class="approval" data-action="approval"><span data-icon="hand"></span><span id="approval-label">请求批准</span></button><div class="spacer"></div><button type="button" class="model" data-action="model"><span id="model-label">5.6 Sol 高</span><span data-icon="chevron"></span></button><button type="button" data-action="mic" aria-label="麦克风" data-icon="mic"></button><button type="submit" class="send" aria-label="发送消息"><span data-icon="wave"></span></button></div></form><input id="file" type="file" multiple hidden></div>
</main>
<aside class="rightbar" aria-label="工具栏"><div class="right-tools"><button data-action="focus" aria-label="专注模式" data-icon="expand"></button><button class="active" data-action="right" aria-label="折叠右栏" data-icon="panel"></button></div><div class="tool-shortcuts"><button data-action="browser"><span data-icon="globe"></span><span data-copy="browser">浏览器</span><kbd>⌘T</kbd></button><button data-action="terminal"><span data-icon="terminal"></span><span data-copy="terminal">终端</span><kbd>⌃`</kbd></button></div><div class="tool-preview" hidden></div><div class="resize resize-right" role="separator" tabindex="0" aria-label="调整右栏宽度" aria-orientation="vertical"></div></aside>
<button class="restore-right" data-action="right" aria-label="展开右栏" data-icon="panel"></button>
</div><dialog id="dialog"><header><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭" data-icon="close"></button></header><div id="dialog-body"></div></dialog><div id="toast" role="status"></div><script src="./main.js?v=3" defer></script><script src="./mobius.js?v=2" defer></script><script src="./sketch.js?v=1" defer></script></body></html>
