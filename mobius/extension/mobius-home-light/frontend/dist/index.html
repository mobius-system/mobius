<!doctype html>
<html lang="zh-CN" class="mobius-light-bootstrap">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>莫比乌斯 · 明亮版</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff; }
    .light-loader { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; }
    .light-loader::before { content: ""; width: 42px; height: 42px; border: 2px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .light-loader::before { animation: none; } }
  </style>
</head>
<body>
  <div class="light-loader" aria-label="正在载入"></div>
  <script src="./bootstrap.js"></script>
</body>
</html>
