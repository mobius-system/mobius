<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8f5ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5fbff"/>
      <stop offset="0.52" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fff0f7"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#315175" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#087f8c"/>
    </marker>
    <style>
      .title{font:800 54px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#101828}
      .sub{font:500 25px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#526071}
      .node-title{font:800 35px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#101828}
      .node-sub{font:550 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475467}
      .core-title{font:850 64px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#101828}
      .core-sub{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#087f8c}
      .label{font:700 19px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#155e75}
      .box{fill:#fff;stroke:#a9bbcf;stroke-width:2}
      .cyan{fill:#d9f6f8;stroke:#0891a2}
      .blue{fill:#e2edff;stroke:#3976d7}
      .green{fill:#dcf5eb;stroke:#18805c}
      .amber{fill:#fff1cf;stroke:#a76b09}
      .rose{fill:#ffe4ec;stroke:#cf4267}
      .line{fill:none;stroke:#087f8c;stroke-width:4;marker-end:url(#arrow)}
      .line-soft{fill:none;stroke:#52779c;stroke-width:3;stroke-dasharray:10 10}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#stage)"/>
  <g opacity="0.12">
    <path d="M0 120H1920M0 240H1920M0 360H1920M0 480H1920M0 600H1920M0 720H1920M0 840H1920M0 960H1920" stroke="#315175"/>
    <path d="M120 0V1080M240 0V1080M360 0V1080M480 0V1080M600 0V1080M720 0V1080M840 0V1080M960 0V1080M1080 0V1080M1200 0V1080M1320 0V1080M1440 0V1080M1560 0V1080M1680 0V1080M1800 0V1080" stroke="#315175"/>
  </g>
  <text x="90" y="92" class="title">Mobius：人机物智算协同的自进化超级智能体系统</text>
  <text x="92" y="136" class="sub">把世界中的人、机、物、智、算组织成一个可持续进化的协同智能体系统</text>
  <path d="M415 258C210 421 247 755 504 890C772 1032 1215 1004 1452 842C1674 690 1662 405 1477 260" fill="none" stroke="#0b9bb0" stroke-width="9" stroke-opacity="0.28" stroke-linecap="round"/>
  <text x="1360" y="229" class="label">自进化回路：执行 → 反馈 → 沉淀 → 新能力</text>
  <g filter="url(#shadow)">
    <ellipse cx="960" cy="540" rx="320" ry="142" fill="url(#core)" stroke="#087f8c" stroke-width="4"/>
    <ellipse cx="960" cy="540" rx="250" ry="92" fill="#f7fbff" stroke="#59748e" stroke-width="2"/>
  </g>
  <text x="960" y="520" text-anchor="middle" class="core-title">Mobius</text>
  <text x="960" y="570" text-anchor="middle" class="core-sub">自进化超级智能体系统</text>
  <text x="960" y="610" text-anchor="middle" class="sub">Agentic OS 内核 · 协同编排 · 持续生长</text>
  <rect x="112" y="376" width="330" height="210" rx="24" class="box blue"/>
  <text x="154" y="430" class="node-title">人</text>
  <text x="154" y="472" class="node-sub">个人 / 团队 / 组织</text>
  <text x="154" y="518" class="node-sub">提出目标 · 协同开发 · 验收反馈</text>
  <path d="M442 486C574 462 655 476 704 512" class="line"/>
  <text x="455" y="450" class="label">小莫 / 自然交互</text>
  <rect x="760" y="166" width="400" height="178" rx="24" class="box cyan"/>
  <text x="810" y="222" class="node-title">智</text>
  <text x="810" y="264" class="node-sub">Agent 编队 / AI 模型 / 知识资产</text>
  <text x="810" y="310" class="node-sub">拆解 · 推理 · 执行 · 沉淀</text>
  <path d="M960 344V396" class="line"/>
  <rect x="1382" y="278" width="390" height="212" rx="24" class="box amber"/>
  <text x="1430" y="334" class="node-title">算</text>
  <text x="1430" y="376" class="node-sub">GPU 集群 / 云端算力 / 本地算力</text>
  <text x="1430" y="422" class="node-sub">训练 · 仿真 · 测试 · 数据处理</text>
  <path d="M1280 505C1346 450 1378 420 1382 384" class="line"/>
  <text x="1280" y="442" class="label">SSH / 任务分发</text>
  <rect x="1352" y="660" width="420" height="228" rx="24" class="box green"/>
  <text x="1400" y="718" class="node-title">机</text>
  <text x="1400" y="760" class="node-sub">机器人 / 工作站 / 终端设备</text>
  <text x="1400" y="806" class="node-sub">开发 · 调试 · 部署 · 现实动作</text>
  <path d="M1262 585C1345 612 1375 658 1352 724" class="line"/>
  <text x="1282" y="632" class="label">AIMUX / 远程终端</text>
  <rect x="190" y="694" width="410" height="204" rx="24" class="box rose"/>
  <text x="238" y="750" class="node-title">物</text>
  <text x="238" y="792" class="node-sub">嵌入式 / 传感器 / 执行器</text>
  <text x="238" y="838" class="node-sub">ESP32 · 树莓派 · Jetson Nx · 现实对象</text>
  <path d="M704 602C630 644 588 692 600 754" class="line"/>
  <text x="610" y="682" class="label">烧录 / 运行 / 观测</text>
  <rect x="158" y="206" width="300" height="98" rx="20" class="box"/>
  <text x="196" y="264" class="node-sub">NAS / OSS · 数据与知识</text>
  <path d="M458 254C594 286 690 350 782 430" class="line-soft"/>
  <text x="508" y="300" class="label">SSH / SFTP</text>
  <rect x="1260" y="96" width="336" height="98" rx="20" class="box"/>
  <text x="1300" y="154" class="node-sub">云服务器 / 开放网络资源</text>
  <path d="M1278 194C1212 268 1166 354 1136 430" class="line-soft"/>
  <rect x="710" y="762" width="500" height="106" rx="28" class="box cyan"/>
  <text x="960" y="810" text-anchor="middle" class="node-title">持续开发 · 部署 · 学习 · 进化</text>
  <text x="960" y="848" text-anchor="middle" class="node-sub">把执行结果沉淀为知识、工具、产品与机器人能力</text>
  <path d="M960 682V762" class="line"/>
</svg>
