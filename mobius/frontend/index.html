<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>莫比乌斯AI</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/favicon-32.png">
  <!-- 字体改为本地自托管 (frontend/public/fonts/ + src/index.css @font-face), 不再连接 fonts.googleapis.com -->
  <script>
    // 同步阻塞拉取品牌配置 (logo/系统名/Tab 标题), 避免 React 挂载后的首屏闪烁.
    // 接口只返回 3 个字段, 极小; 同步 XHR 等待 ~10-50ms 可接受.
    (function () {
      var DEFAULT = { hideLogo: false, systemNameZh: '莫比乌斯AI', systemNameEn: 'Mobius', hiddenFolderName: '.mobius', appDir: '' };
      var branding = DEFAULT;
      try {
        var x = new XMLHttpRequest();
        x.open('GET', '/api/auth/branding', false); // 同步
        x.send();
        if (x.status === 200) {
          var j = JSON.parse(x.responseText);
          branding = {
            hideLogo: !!j.hideLogo,
            systemNameZh: typeof j.systemNameZh === 'string' ? j.systemNameZh : DEFAULT.systemNameZh,
            systemNameEn: typeof j.systemNameEn === 'string' ? j.systemNameEn : DEFAULT.systemNameEn,
            hiddenFolderName: typeof j.hiddenFolderName === 'string' && j.hiddenFolderName ? j.hiddenFolderName : DEFAULT.hiddenFolderName,
            appDir: typeof j.appDir === 'string' ? j.appDir : DEFAULT.appDir,
          };
        }
      } catch (e) { /* 拉失败时回退默认值, 不阻塞首屏 */ }
      // 浏览器本地「自定义系统名称」(只在本机 localStorage, 不上传服务器) 只用于首屏标题,
      // 让标题直接就是用户自定义的名字, 不会先闪一下默认名.
      // 注意: **不要**把覆盖写回 branding —— window.__BRANDING__ 必须保持服务端原值,
      // 否则 store 里"服务端基底 + 本地覆盖"的叠加会失去基底, 清除自定义后回不到默认名.
      var titleName = branding.systemNameZh;
      try {
        var custom = JSON.parse(localStorage.getItem('mobius:custom-brand-name') || 'null');
        if (custom && typeof custom === 'object' && typeof custom.zh === 'string' && custom.zh) {
          titleName = custom.zh;
        }
      } catch (e) { /* 自定义名解析失败时沿用服务端配置 */ }
      window.__BRANDING__ = branding;
      document.title = titleName || ' ';
    })();
  </script>
</head>
<body class="bg-bg-0 text-gray-100 antialiased">
  <div id="root"></div>
  <script defer src="/extension/_sdk/designer-eye/loader.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
