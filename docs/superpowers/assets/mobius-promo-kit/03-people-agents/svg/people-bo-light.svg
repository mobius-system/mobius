          <path d="M39 50h2M55 50h2M43 59c3 3 7 3 10 0" fill="none" stroke="#17213A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
          <path d="M17 63 A38 38 0 0 1 29 21" fill="none" stroke="url(#brand-gradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
