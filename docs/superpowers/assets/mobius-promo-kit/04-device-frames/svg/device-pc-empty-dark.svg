      <g id="energy-trail" opacity="0"><path d="M12 88 C48 102 112 102 148 82" fill="none" stroke="url(#brand-gradient)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/></g>

